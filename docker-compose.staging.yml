services:

  postgres-staging:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: fara_staging
      POSTGRES_USER: openpg
      POSTGRES_PASSWORD: openpgpwd
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    shm_size: 256MB
    healthcheck:
      test: [CMD-SHELL, pg_isready -U openpg -d fara_staging]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-staging:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-staging:
        condition: service_healthy
    environment:
      DOTORM_DATABASES_POSTGRES__FARA__HOST: postgres-staging
      DOTORM_DATABASES_POSTGRES__FARA__PORT: 5432
      DOTORM_DATABASES_POSTGRES__FARA__USER: openpg
      DOTORM_DATABASES_POSTGRES__FARA__PASSWORD: openpgpwd
      DOTORM_DATABASES_POSTGRES__FARA__DATABASE: fara_staging
      DOTORM_DATABASES_POSTGRES__FARA__DRIVER: asyncpg
      DOTORM_DATABASES_POSTGRES__FARA__SYNC_DB: true
      PGSSLMODE: disable
      LOGGER__LOG_LEVEL: DEBUG
      CRON__ENABLED: true
      CRON__CHECK_INTERVAL: 60
      CRON__MAX_THREADS: 2
      SITE_URL: http://185.244.51.110:8081
      API_URL: http://185.244.51.110:8081/api
    ports:
      - 8001:8000
    volumes:
      - filestore_staging:/app/filestore

  frontend-staging:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend-staging
    ports:
      - 8081:80

volumes:
  pgdata_staging:
  filestore_staging:
